; AOWIS map server system configuration
;
; This file is installed only when /etc/aowis-server-map/map-server.ini does not
; already exist. The installer replaces the empty API-key fields with separate
; cryptographically random keys. Command-line options override these values.

[server]
; Use 127.0.0.1 when the reverse proxy runs on this host.
; When the reverse proxy runs on another private-network host, set this to the
; map server's private address and restrict port 8122 to the proxy host by firewall.
listen_address=127.0.0.1
port=8122
max_pending_requests=2048

[downloads]
max_active_downloads=32
; Only 2D raster map downloads. Disable for a fully local 2D deployment.
remote_fetch_enabled=true
; Optional named zoom-dependent profile; see README.md.
coverage=
; Leave empty in systemd service mode. CacheDirectory= in the unit provides
; /var/cache/aowis-server-map through the CACHE_DIRECTORY environment variable.
cache_directory=

[terrain]
; Terrain/elevation is optional and independent of raster map tile serving.
enabled=true
; Set false for strictly offline operation. Cached/offline data remains usable.
remote_fetch_enabled=true
; Dataset used for point-elevation requests.
default_dataset=copernicus-glo30
; Maximum terrain jobs (running + queued); overflow returns HTTP 503.
maximum_jobs=128
; Maximum concurrently executing terrain tasks; remaining admitted jobs are queued.
maximum_workers=4
; Slow links: connect timeout, idle timeout, and total download duration (seconds).
connect_timeout_seconds=30
inactivity_timeout_seconds=120
download_deadline_seconds=1800
coverage=
; Leave empty to use /var/cache/aowis-server-map/terrain in systemd mode.
cache_directory=

[storage]
; Persistent imported data; unlike /var/cache this survives cache cleanups.
; Existing installations with an empty value keep their original layout.
permanent_data_directory=/var/lib/aowis-server-map/data
; Optional path for provider changes saved through the GUI. By default, the
; systemd service stores them in /var/lib/aowis-server-map/providers.ini.
provider_state_file=

; Map providers use built-in defaults until you define [map_provider.*] sections.
; Use --print-default-config to see provider UUIDs, zoom limits, and example regions.
; GUI edits save to a separate service-owned providers.ini under /var/lib.
; /etc is never modified through the running server's API.

[authentication]
; Required by the supplied systemd unit. Authorizes /status and tile GET requests.
api_key=
; Required separately by the supplied systemd unit. Authorizes only cache DELETE requests.
delete_api_key=
