# Internet-facing reverse proxy bootstrap configuration for Let's Encrypt Certbot.
# Replace the three example values below before enabling this site:
#   maps.example.com
#   http://127.0.0.1:8122
#   https://app.example.com
#
# Install and enable this HTTP virtual host first, then run:
#   sudo certbot --apache --redirect -d maps.example.com
#
# Certbot obtains the certificate, creates/enables the HTTPS virtual host and
# changes this port-80 virtual host to redirect to HTTPS. Literal values are used
# deliberately because Certbot's Apache plugin may not handle Apache Define
# variables reliably while discovering and modifying virtual hosts.
<VirtualHost *:80>
    ServerName maps.example.com

    ProxyRequests Off
    ProxyPreserveHost On
    SSLProxyEngine On
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8122/ connectiontimeout=5 timeout=65 retry=0
    ProxyPassReverse / http://127.0.0.1:8122/

    # Expose the API only to the exact browser GUI origin. Do not use "*" here.
    Header always unset Access-Control-Allow-Origin
    Header always unset Access-Control-Allow-Methods
    Header always unset Access-Control-Allow-Headers
    Header always unset Access-Control-Allow-Credentials
    Header always unset Access-Control-Expose-Headers
    Header always unset Access-Control-Max-Age
    Header always set Access-Control-Allow-Origin "https://app.example.com"
    Header always set Access-Control-Allow-Methods "GET, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, X-API-Key, Accept, Content-Type"
    Header always set Access-Control-Max-Age "86400"
    Header always merge Vary "Origin"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    LimitRequestFields 40
    LimitRequestFieldSize 8190
    LimitRequestLine 4094
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</VirtualHost>
