# Same-host HTTP reverse proxy for local installations and development.
# The GUI-facing Apache server and aowis-server-map run on the same machine.
Define AOWIS_MAP_SERVER_NAME aowis-server-map.localhost
Define AOWIS_MAP_BACKEND http://127.0.0.1:8122
Define AOWIS_MAP_ALLOWED_ORIGIN http://aowis-server-gui.localhost

<VirtualHost *:80>
    ServerName ${AOWIS_MAP_SERVER_NAME}

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / ${AOWIS_MAP_BACKEND}/ connectiontimeout=5 timeout=65 retry=0
    ProxyPassReverse / ${AOWIS_MAP_BACKEND}/

    # Replace the configured origin with the exact origin from which the GUI is served.
    Header always unset Access-Control-Allow-Origin
    Header always unset Access-Control-Allow-Methods
    Header always unset Access-Control-Allow-Headers
    Header always unset Access-Control-Allow-Credentials
    Header always unset Access-Control-Expose-Headers
    Header always unset Access-Control-Max-Age
    Header always set Access-Control-Allow-Origin "${AOWIS_MAP_ALLOWED_ORIGIN}"
    Header always set Access-Control-Allow-Methods "GET, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Authorization, X-API-Key, Accept, Content-Type"
    Header always set Access-Control-Max-Age "86400"
    Header always merge Vary "Origin"

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    LimitRequestFields 40
    LimitRequestFieldSize 8190
    LimitRequestLine 4094
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
</VirtualHost>
